{% extends "expert_base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block content %}
<section class="login-card card">
    <p class="eyebrow">{{ t.login_eyebrow }}</p>
    <h1>{{ t.login_h1 }}</h1>
    <p class="lead">{{ t.login_lead }}</p>
    <form method="post" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ expert_csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="access_code">{{ t.login_code }}</label>
        <input id="access_code" name="access_code" type="password" autocomplete="off" required autofocus>
        <button class="button button-primary" type="submit">{{ t.login_button }}</button>
    </form>
</section>
{% endblock %}
